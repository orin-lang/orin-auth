[package]
name = "orin-auth"
version = "0.1.0"
entry = "src/module.or"

[dependencies]
orin-web = { path = "../orin-web" }

# Compiler-enforced module dependency policy. The package facade preserves the public API.

[modules."."]
allowed_dependencies = ["core", "credentials", "crypto", "oidc", "protection", "sessions"]

[modules.core]
allowed_dependencies = ["crypto", "storage"]

[modules.crypto]
allowed_dependencies = []

[modules.storage]
allowed_dependencies = []

[modules.sessions]
allowed_dependencies = ["core", "crypto", "storage"]

[modules.credentials]
allowed_dependencies = ["core", "crypto", "sessions", "storage"]

[modules.protection]
allowed_dependencies = ["core", "crypto", "sessions", "storage"]

[modules.oidc]
allowed_dependencies = ["core", "credentials", "crypto", "sessions", "storage"]
